version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: command_centre_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/command_centre.db:/app/command_centre.db
      - ./backend/.garmin_tokens:/app/.garmin_tokens
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: command_centre_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
